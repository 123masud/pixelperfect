<div class="appointment-item" id="go-appoint">
    <h2>Book your appointment</h2>
    <span><i>We will confirm your appointment within 2 hours</i></span>
    <div class="appointment-form mt-3">
      <form>
        <div class="row">
          <div class="col-lg-12">
            <div class="form-group"><i class="fa-solid fa-user-tie"></i>
            
              <input type="text" class="form-control" placeholder="Enter Your Name">
            </div>
          </div>
          <div class="col-lg-6">
            <div class="form-group"><i class="fa-solid fa-calendar-days"></i>
             
              <input type="text" class="form-control" placeholder="Enter Your Age">
            </div>
          </div>
          <div class="col-lg-6">
            <div class="form-group"><i class="fa-solid fa-person"></i>
            
              <select class="form-control" id="exampleFormControlSelect2">
                <option>Select Your Gender</option>
                <option>Male</option>
                <option>Female</option>
                
              </select>
            </div>
          </div>
            
     
          <div class="col-lg-6">
            <div class="form-group"><i class="fa-regular fa-envelope"></i>
            
              <input type="email" class="form-control" placeholder="Enter Your Email">
            </div>
          </div>
          <div class="col-lg-6">
            <div class="form-group"><i class="fa-solid fa-phone"></i>
            
              <input type="text" class="form-control" placeholder="Enter Your Phone Number">
            </div>
          </div>
          <div class="col-lg-6">
            <div class="form-group"><i class="fa-solid fa-house-chimney-medical"></i>
             
              <select class="form-control" id="exampleFormControlSelect1">
                <option>Select Department</option>
                <option>Neurology</option>
                <option>Cardiology</option>
                <option>Pathology</option>
              </select>
            </div>
          </div>
          <div class="col-lg-6">
            <div class="form-group"><i class="fa-solid fa-user-doctor"></i>
            
              <select class="form-control" id="exampleFormControlSelect2">
                <option>Choose Your Doctor</option>
                <option>John Smith</option>
                <option>Sarah Taylor</option>
                <option>Stevn King</option>
              </select>
            </div>
          </div>
          <div class="col-lg-12">
            <div class="form-group"><i class="fa-solid fa-address-book"></i>
             
              <textarea class="form-control textarea" placeholder="Enter Your address"></textarea>
            </div>
          </div>
       
        </div>
        <div class="text-center">
          <button type="submit" class="btn-submit">Submit<span><i class="fa-solid fa-chevron-right"></i></span></button>
        </div>
      </form>
    </div>
  </div>
